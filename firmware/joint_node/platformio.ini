; SixEyes v1 Universal Joint PCB — one firmware image, four board roles.
; Role is selected per-environment via -DJOINT_NODE_ID (see src/modules/config/node_config.h).
; Target module: ESP32-C6 Super Mini (flash over its USB-C; esp32-c6-devkitm-1 board def is compatible).
; See docs/reference/v1.2_PCB_Design_Reference.md and docs/reference/CAN_MESSAGE_PROTOCOL.md.

[env]
; The ESP32-C6 needs the Arduino core 3.x that PlatformIO's official 'espressif32' platform does not ship.
; This pins the community pioarduino platform release the firmware was built and tested with.
platform = https://github.com/pioarduino/platform-espressif32/releases/download/51.03.07/platform-espressif32.zip
board = esp32-c6-devkitm-1
framework = arduino

build_flags =
  -DCORE_MHZ=160
  -DCONTROL_LOOP_HZ=250
  ; Super Mini: Serial -> native USB CDC. Without this Serial would claim UART0
  ; (GPIO16/17) and collide with the TMC2209 UART RX pin (GPIO17).
  -DARDUINO_USB_MODE=1
  -DARDUINO_USB_CDC_ON_BOOT=1

monitor_speed = 115200

lib_deps =
  https://github.com/teemuatlut/TMCStepper.git

[env:v1_base]
build_flags =
  ${env.build_flags}
  -DJOINT_NODE_ID=1
  -DSIXEYES_BLE
lib_deps =
  ${env.lib_deps}
  h2zero/NimBLE-Arduino@2.5.1

[env:v1_shoulder_l]
build_flags =
  ${env.build_flags}
  -DJOINT_NODE_ID=2

[env:v1_shoulder_r]
build_flags =
  ${env.build_flags}
  -DJOINT_NODE_ID=3

[env:v1_elbow]
build_flags =
  ${env.build_flags}
  -DJOINT_NODE_ID=4

; Base board that checks the host-protocol framing against the golden vectors at
; boot and prints "[SELFTEST] host codec: all golden vectors passed" (or what
; failed) on the serial monitor. For bench use; not a role of the arm.
[env:v1_base_selftest]
build_flags =
  ${env.build_flags}
  -DJOINT_NODE_ID=1
  -DSIXEYES_BLE
  -DHOST_LINK_SELFTEST
lib_deps =
  ${env.lib_deps}
  h2zero/NimBLE-Arduino@2.5.1

; BENCH ONLY. One lone board with one motor and NO bus: type commands in the
; serial monitor to move the motor, run homing and watch StallGuard (see the
; "Bench test" section of docs/README.md). It lets the motor be enabled without
; a bus heartbeat, so never flash it to a board that is on the arm.
[env:v1_bench]
build_flags =
  ${env.build_flags}
  -DJOINT_NODE_ID=2
  -DBENCH_CONSOLE
