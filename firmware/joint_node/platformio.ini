; SixEyes v1 Universal Joint PCB — one firmware image, four board roles.
; Role is selected per-environment via -DJOINT_NODE_ID (see src/modules/config/node_config.h).
; Target module: ESP32-C6 Super Mini (flash over its USB-C; esp32-c6-devkitm-1 board def is compatible).
; See docs/reference/v1.2_PCB_Design_Reference.md and docs/reference/CAN_MESSAGE_PROTOCOL.md.

[env]
platform = espressif32
board = esp32-c6-devkitm-1
framework = arduino

build_flags =
  -DCORE_MHZ=160
  -DCONTROL_LOOP_HZ=250
  ; Super Mini: Serial -> native USB CDC. Without this Serial would claim UART0
  ; (GPIO16/17) and collide with the TMC2209 UART RX pin (GPIO17).
  -DARDUINO_USB_MODE=1
  -DARDUINO_USB_CDC_ON_BOOT=1

monitor_speed = 115200

lib_deps =
  https://github.com/teemuatlut/TMCStepper.git

[env:v1_base]
build_flags =
  ${env.build_flags}
  -DJOINT_NODE_ID=1

[env:v1_shoulder_l]
build_flags =
  ${env.build_flags}
  -DJOINT_NODE_ID=2

[env:v1_shoulder_r]
build_flags =
  ${env.build_flags}
  -DJOINT_NODE_ID=3

[env:v1_elbow]
build_flags =
  ${env.build_flags}
  -DJOINT_NODE_ID=4
