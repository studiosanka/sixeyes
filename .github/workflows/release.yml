name: Release

# Push a tag such as v1.0.0 (or v1.0.0-pre for a pre-release) to publish a GitHub Release with the
# firmware binaries for the four board roles, the bill of materials, and, once they exist, zips of the
# manufacturing files (hardware/pcb/gerbers) and the printable parts (hardware/mechanical/stl).
# "Run workflow" (manual) builds everything and uploads it as a workflow artifact without publishing.

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    name: Build and publish release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install PlatformIO
        run: |
          python -m pip install --upgrade pip
          pip install platformio

      - name: Cache PlatformIO packages
        uses: actions/cache@v4
        with:
          path: ~/.platformio
          key: ${{ runner.os }}-platformio-${{ hashFiles('firmware/joint_node/platformio.ini') }}
          restore-keys: |
            ${{ runner.os }}-platformio-

      - name: Build all four board roles
        working-directory: firmware/joint_node
        run: pio run

      - name: Collect release files
        env:
          NAME: ${{ github.ref_type == 'tag' && github.ref_name || format('dev-{0}', github.run_number) }}
        run: |
          mkdir -p release
          for env in v1_base v1_shoulder_l v1_shoulder_r v1_elbow; do
            cp "firmware/joint_node/.pio/build/$env/firmware.bin" "release/sixeyes-$env-$NAME.bin"
          done
          cp hardware/pcb/bom/v1.2_BOM_LCSC.csv release/
          # Zip the manufacturing files and printable parts only when they contain more than the README.
          if [ -n "$(find hardware/pcb/gerbers -type f ! -name README.md)" ]; then
            (cd hardware/pcb/gerbers && zip -r "../../../release/sixeyes-gerbers-$NAME.zip" . -x README.md)
          fi
          if [ -n "$(find hardware/mechanical/stl -type f ! -name README.md)" ]; then
            (cd hardware/mechanical/stl && zip -r "../../../release/sixeyes-stl-$NAME.zip" . -x README.md)
          fi
          (cd release && sha256sum * > SHA256SUMS.txt)
          ls -l release

      - name: Upload files as a workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-files
          path: release/
          retention-days: 30

      - name: Publish GitHub Release
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          files: release/*
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-') }}
          body: |
            Files for the SixEyes joint board: firmware binaries for the four board roles
            (`base`, `shoulder_l`, `shoulder_r`, `elbow`), the bill of materials, and a `SHA256SUMS.txt`
            to check your downloads.

            This is a work in progress. The firmware has not been tested on hardware yet. Start with the
            [documentation](https://github.com/${{ github.repository }}/blob/${{ github.ref_name }}/docs/README.md).
