name: Build Firmware

# Builds the joint-board firmware for each of the four board roles.

on:
  push:
    branches: [main]
    paths:
      - 'firmware/**'
      - '.github/workflows/platformio-build.yml'
  pull_request:
    paths:
      - 'firmware/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build (${{ matrix.env }})
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        env: [v1_base, v1_shoulder_l, v1_shoulder_r, v1_elbow]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install PlatformIO
        run: |
          python -m pip install --upgrade pip
          pip install platformio

      - name: Cache PlatformIO packages
        uses: actions/cache@v4
        with:
          path: ~/.platformio
          key: ${{ runner.os }}-platformio-${{ hashFiles('firmware/joint_node/platformio.ini') }}
          restore-keys: |
            ${{ runner.os }}-platformio-

      - name: Build
        working-directory: firmware/joint_node
        run: pio run -e ${{ matrix.env }}

      - name: Report memory use
        working-directory: firmware/joint_node
        run: pio run -e ${{ matrix.env }} --target size

      - name: Upload firmware
        uses: actions/upload-artifact@v4
        with:
          name: firmware-${{ matrix.env }}
          path: firmware/joint_node/.pio/build/${{ matrix.env }}/firmware.bin
          retention-days: 14
